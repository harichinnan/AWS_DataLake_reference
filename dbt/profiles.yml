citibike_lake:
  target: dev
  outputs:
    dev:
      type: athena
      database: awsdatacatalog
      schema: citibike_lake_dev
      region_name: us-east-1
      work_group: citibike-lake-dev-wg
      s3_staging_dir: s3://citibike-lake-dev-452167573733-us-east-1-athena-results/dbt/
      s3_data_dir: s3://citibike-lake-dev-452167573733-us-east-1-warehouse/warehouse/citibike/iceberg/dbt/
      s3_data_naming: schema_table_unique
      aws_profile_name: "{{ env_var('AWS_PROFILE', 'citibike-lake-dev') }}"
      threads: 4
      num_retries: 3
      poll_interval: 2

    # Used by the AWS Batch dbt runner. Credentials come from the task role, so aws_profile_name is omitted.
    prod:
      type: athena
      database: awsdatacatalog
      schema: "{{ env_var('DBT_ATHENA_SCHEMA', 'citibike_lake_dev') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      work_group: "{{ env_var('DBT_ATHENA_WORKGROUP', 'citibike-lake-dev-wg') }}"
      s3_staging_dir: "{{ env_var('DBT_ATHENA_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('DBT_ATHENA_DATA_DIR') }}"
      s3_data_naming: schema_table_unique
      threads: 4
      num_retries: 3
      poll_interval: 2

    # Used by .github/workflows/dbt-ci.yml for per-PR slim builds. The workflow
    # sets DBT_ATHENA_SCHEMA to a per-PR Glue database (citibike_lake_dev_ci_pr_<num>)
    # so PRs don't collide. Credentials come from the gha-ci OIDC role.
    ci:
      type: athena
      database: awsdatacatalog
      schema: "{{ env_var('DBT_ATHENA_SCHEMA', 'citibike_lake_dev_ci') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      work_group: "{{ env_var('DBT_ATHENA_WORKGROUP', 'citibike-lake-dev-wg') }}"
      s3_staging_dir: "{{ env_var('DBT_ATHENA_STAGING_DIR') }}"
      s3_data_dir: "{{ env_var('DBT_ATHENA_DATA_DIR') }}"
      s3_data_naming: schema_table_unique
      threads: 4
      num_retries: 3
      poll_interval: 2
