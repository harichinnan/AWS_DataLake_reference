name: image-cd

on:
  push:
    branches: [main]
    paths:
      - 'docker/dbt-runner/**'
      - '.github/workflows/image-cd.yml'

concurrency:
  group: image-cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: citibike-lake-dev/dbt-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/citibike-lake-dev-gha-pipeline
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          SHA="${GITHUB_SHA::8}"
          REPO_URI="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}"
          docker buildx build \
            --platform linux/amd64 \
            --file docker/dbt-runner/Dockerfile \
            --tag "${REPO_URI}:${SHA}" \
            --tag "${REPO_URI}:latest" \
            --push \
            .
          echo "Pushed ${REPO_URI}:${SHA} and :latest"
