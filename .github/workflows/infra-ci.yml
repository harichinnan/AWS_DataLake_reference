name: infra-ci

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci.yml'

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/citibike-lake-dev-gha-infra
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform init
        run: terraform -chdir=terraform init -input=false

      - name: terraform validate
        run: terraform -chdir=terraform validate

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=terraform plan -no-color -input=false -lock=false -out tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            const body = `### terraform plan\n\n\`\`\`\n${truncated}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
