name: dbt-ci

on:
  pull_request:
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-ci.yml'

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docker/dbt-runner/requirements.txt

      - name: Install dbt-athena
        run: pip install -r docker/dbt-runner/requirements.txt

      - name: dbt parse
        # Parse compiles the project graph without hitting the warehouse — verifies
        # ref/source resolution, Jinja syntax, and macro signatures.
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: dbt parse --project-dir dbt --profiles-dir dbt --target dev || dbt parse --project-dir dbt --profiles-dir dbt
