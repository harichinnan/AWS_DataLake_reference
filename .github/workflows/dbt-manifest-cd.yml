name: dbt-manifest-cd

# Parse-only fallback manifest publisher. The Batch dbt-runner is the source
# of truth for `dbt/manifest/latest/` — it uploads target/manifest.json after
# every green run. This workflow publishes a parse-only manifest to a parallel
# key (`dbt/manifest/parse-fallback/`) so PR slim-CI has *something* to defer
# against on first deploy, before the orchestrator has run end-to-end, or when
# pipeline orchestration is disabled entirely.
#
# `dbt parse` does not touch the warehouse — it just compiles the project
# graph — so this job runs entirely inside the GHA runner with no Athena/Glue
# permissions. It reuses the gha-pipeline role for the artifacts bucket write.

on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-manifest-cd.yml'

concurrency:
  group: dbt-manifest-cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docker/dbt-runner/requirements.txt

      - name: Install dbt-athena
        run: pip install -r docker/dbt-runner/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/citibike-lake-dev-gha-pipeline
          aws-region: ${{ vars.AWS_REGION }}

      - name: dbt deps + parse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          # Parse against the dev profile — it only needs a syntactically
          # valid profile, not credentials. Falls back to no-target so a
          # half-configured profile still produces a manifest.
          dbt parse --project-dir dbt --profiles-dir dbt --target dev || \
            dbt parse --project-dir dbt --profiles-dir dbt

      - name: Upload parse-fallback manifest
        run: |
          BUCKET="citibike-lake-dev-artifacts-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}"
          aws s3 cp dbt/target/manifest.json \
            "s3://${BUCKET}/dbt/manifest/parse-fallback/manifest.json"
          echo "Published parse-fallback manifest from ${GITHUB_SHA::8} to s3://${BUCKET}/dbt/manifest/parse-fallback/manifest.json"
